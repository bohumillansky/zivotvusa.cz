baseURL = 'https://zivotvusa.cz/'
enableRobotsTXT = true
defaultContentLanguage = 'cs'
locale = 'cs-CZ'
title = 'Život v USA - Americké zkušenosti očima Čecha'
theme = 'PaperMod'

[pagination]
  pagerSize = 5

[params]
  comments = true
  # Public values only; the Turnstile secret and GitHub key belong in Worker secrets.
  commentServiceURL = 'https://zivotvusa-comments.zivotvusa.workers.dev/comments'
  turnstileSiteKey = '0x4AAAAAAFR6oYI8PlJfZzoR'
  title = 'Život v USA - Americké zkušenosti očima Čecha'
  description = 'Osobní blog o životě v USA očima českého expata. Finanční srovnání, práce, bydlení a každodenní život v Americe vs Česko. Dlouhodobé zkušenosti z první ruky.'
  keywords = ['život v usa', 'český expat', 'amerika vs česko', 'práce v usa', 'finance usa']
  author = ''
  DateFormat = ":date_long"

  # Zobrazování článků (Regular Mode je výchozí)
  ShowReadingTime = true
  ShowShareButtons = true
  ShareButtons = ["facebook", "twitter", "linkedin"]
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  
  disableSpecial1stPost = true


[params.homeInfoParams]
  Content = """
  Bude to 8 let, co jsme se s rodinou přestěhovali z Česka do Spojených států. Na blogu zivotvusa.cz sdílím
  osobní zkušenosti s životem v USA – co nás překvapilo, co nám chybí z domova a co nás naopak nadchlo.

  Porovnávám každodenní život, zvyky, mentalitu i svět práce a financí – bez přikrášlování, ale s nadhledem.
  Chci ukázat, co může být v USA inspirací, a zároveň připomenout, co je v Česku často lepší, než si sami uvědomujeme.
  """

# Social Icons - only the ones you want enabled
[[params.socialIcons]]
  name = "facebook"
  url = "https://www.facebook.com/profile.php?id=61578259483337"
[[params.socialIcons]]
  name = "instagram"
  url = "https://instagram.com/yourusername"

[[params.socialIcons]]
  name = "x"
  url = "https://x.com/ZivotVUSAcz"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/yourusername"

[params.label]
  text = "Život v USA"

[params.assets]
  favicon = 'icons/favicon-32.png'
  favicon16x16 = 'icons/favicon-16.png'
  favicon32x32 = 'icons/favicon-32.png'
  apple_touch_icon = 'icons/favicon-180.png'
  theme_color = '#0b2c48'

[params.ads]
  home = true
  post = true
  list = true

# Výstupy pro vyhledávání
[outputs]
  home = ["HTML", "RSS", "JSON", "COMMENTS"]

[outputFormats.COMMENTS]
  mediaType = "application/json"
  baseName = "comment-posts"
  isPlainText = true
  notAlternative = true

# Vyhledávání
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  keys = ["title", "permalink", "summary", "content"]

# Menu
[[menu.main]]   
  name = "Blog"
  url = "/"
  weight = 10

[[menu.main]]
  name = "Kategorie"
  url = "/categories/"
  weight = 20

[[menu.main]]
  name = "Tagy"
  url = "/tags/"
  weight = 30

[[menu.main]]
  name = "Hledat"
  url = "/search/"
  weight = 40

[languages]
  [languages.cs]
    label = "Čeština"
    locale = "cs-CZ"
    weight = 1

[caches.images]
  dir = ':cacheDir/images'
